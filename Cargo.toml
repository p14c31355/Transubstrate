[workspace]
resolver = "2"
members = ["crates/ts-core", "crates/transubstrate"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/p14c31355/Transubstrate"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
clap = { version = "4.5", features = ["derive"] }
ts-core = { path = "crates/ts-core" }

[profile.release]
debug = true
